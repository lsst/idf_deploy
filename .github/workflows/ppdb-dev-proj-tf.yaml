# Deploys PPDB GCP Dev Project with Terraform
name: 'PPDB Dev GCP Project'

on:
  pull_request:
    paths:
      - 'environment/deployments/ppdb/env/dev.tfvars'
  push:
    paths:
      - 'environment/deployments/ppdb/env/dev.tfvars'
    branches:
      - main
  # Re-enable this when/if we want to deal with drift
  schedule:
    - cron: 25 2 * * *

jobs:
  terraform:
    name: Terraform
    uses: ./.github/workflows/_reusable-terraform-plan-apply.yaml
    with:
      working_directory: ./environment/deployments/ppdb
      state_prefix: ppdb/dev
      tfvars_file: env/dev.tfvars
    secrets: inherit
