# Deploys roundtable-prod GCP Project with Terraform
name: 'Roundtable Prod New GKE'

on:
  pull_request:
    paths:
      - 'environment/deployments/roundtable/env/production-gke.tfvars'
  push:
    branches:
      - main
    paths:
      - 'environment/deployments/roundtable/env/production-gke.tfvars'
  schedule:
    - cron: 25 2 * * *
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform
    uses: ./.github/workflows/_reusable-terraform-plan-apply.yaml
    with:
      working_directory: ./environment/deployments/roundtable/gke
      state_prefix: roundtable/prod/new-gke
      tfvars_file: ../env/production-gke.tfvars
      apply_on_workflow_dispatch: true
    secrets: inherit
