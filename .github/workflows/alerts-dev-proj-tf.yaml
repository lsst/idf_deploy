# Deploys AlertsProduction Dev GCP Project with Terraform
name: 'Alerts Dev GCP Project'

on:
  pull_request:
    paths:
      - 'environment/deployments/alert-prod/env/dev.tfvars'
  push:
    paths:
      - 'environment/deployments/alert-prod/env/dev.tfvars'
    branches:
      - main
  # Re-enable this when/if we want to deal with drift
  # schedule:
  # - cron: 25 2 * * *

jobs:
  terraform:
    name: Terraform
    uses: ./.github/workflows/_reusable-terraform-plan-apply.yaml
    with:
      working_directory: ./environment/deployments/alert-prod
      state_prefix: alert-prod/dev
      tfvars_file: env/dev.tfvars
    secrets: inherit
