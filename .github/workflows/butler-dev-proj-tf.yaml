# Deploys Dev Integration GCP Project with Terraform
name: 'Butler repo DEV GCP Project'

on:
  pull_request:
    paths:
      - 'environment/deployments/butler-repo/env/dev.tfvars'
  push:
    branches:
      - main
    paths:
      - 'environment/deployments/butler-repo/env/dev.tfvars'
  # Re-enable this when/if we want to deal with drift
  # schedule:
  # - cron: 25 2 * * *

jobs:
  terraform:
    name: Terraform
    uses: ./.github/workflows/_reusable-terraform-plan-apply.yaml
    with:
      working_directory: ./environment/deployments/butler-repo
      state_prefix: butler-repo/dev
      tfvars_file: env/dev.tfvars
    secrets: inherit
