# Deploys Dev Integration GCP Project with Terraform
name: 'PanDA DEV GCP Project'

on:
  pull_request:
    paths:
      - 'environment/deployments/panda/env/dev.tfvars'
  push:
    branches:
      - main
    paths:
      - 'environment/deployments/panda/env/dev.tfvars'
  # Re-enable this when/if we want to deal with drift
  # schedule:
  # - cron: 25 2 * * *

jobs:
  terraform:
    name: Terraform
    uses: ./.github/workflows/_reusable-terraform-plan-apply.yaml
    with:
      working_directory: ./environment/deployments/panda
      state_prefix: panda/dev
      tfvars_file: env/dev.tfvars
    secrets: inherit
