# Deploys Science Platform Int GCP Project with Terraform
name: 'RSP INT ALERTDB'

on:
  pull_request:
    paths:
      - 'environment/deployments/science-platform/env/integration-alertdb.tfvars'
  push:
    branches:
      - main
    paths:
      - 'environment/deployments/science-platform/env/integration-alertdb.tfvars'
  # Re-enable this when/if we want to deal with drift
  # schedule:
  # - cron: 25 2 * * *

jobs:
  terraform:
    name: Terraform
    uses: ./.github/workflows/_reusable-terraform-plan-apply.yaml
    with:
      working_directory: ./environment/deployments/science-platform/alertdb
      state_prefix: science-platform/int/alertdb
      tfvars_file: ../env/integration-alertdb.tfvars
    secrets: inherit
