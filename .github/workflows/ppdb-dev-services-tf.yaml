# Deploys PPDB Dev Services with Terraform
name: 'PPDB Dev Services'

on:
  pull_request:
    paths:
      - 'environment/deployments/ppdb/env/dev-services.tfvars'
  push:
    paths:
      - 'environment/deployments/ppdb/env/dev-services.tfvars'
    branches:
      - main
      # Re-enable this when/if we want to deal with drift
      # schedule:
      # - cron: 25 2 * * *

jobs:
  terraform:
    name: Terraform
    uses: ./.github/workflows/_reusable-terraform-plan-apply.yaml
    with:
      working_directory: ./environment/deployments/ppdb/services
      state_prefix: ppdb/dev/services
      tfvars_file: ../env/dev-services.tfvars
      export_state_bucket: true
      checkout_version: v4
      google_actions_version: v3
      setup_terraform_version: v3
    secrets:
      gcp_credentials: ${{ secrets.GOOGLE_CREDENTIALS }}
      gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
      terraform_state_bucket: ${{ secrets.TERRAFORM_STATE_BUCKET }}
      slack_webhook: ${{ secrets.SLACK_ALERT_WEBHOOK }}
