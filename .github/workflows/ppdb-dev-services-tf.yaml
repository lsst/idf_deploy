# Deploys PPDB Dev Services with Terraform
name: 'PPDB Dev Services'

on:
  pull_request:
    paths:
      - 'environment/deployments/ppdb/env/dev-services.tfvars'
  push:
    paths:
      - 'environment/deployments/ppdb/env/dev-services.tfvars'
    branches:
      - main
      # Re-enable this when/if we want to deal with drift
      # schedule:
      # - cron: 25 2 * * *

jobs:
  terraform:
    name: Terraform
    uses: ./.github/workflows/_reusable-terraform-plan-apply.yaml
    with:
      working_directory: ./environment/deployments/ppdb/services
      state_prefix: ppdb/dev/services
      tfvars_file: ../env/dev-services.tfvars
    secrets: inherit
