# Deploys roundtable-dev GCP Project with Terraform
name: 'Roundtable Dev New GKE'

on:
  pull_request:
    paths:
      - 'environment/deployments/roundtable/env/dev-new-gke.tfvars'
  push:
    branches:
      - main
    paths:
      - 'environment/deployments/roundtable/env/dev-new-gke.tfvars'
  # Re-enable this when/if we want to deal with drift
  schedule:
    - cron: 25 2 * * *
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform
    uses: ./.github/workflows/_reusable-terraform-plan-apply.yaml
    with:
      working_directory: ./environment/deployments/roundtable/gke
      state_prefix: roundtable/dev-new/gke
      tfvars_file: ../env/dev-new-gke.tfvars
      apply_on_workflow_dispatch: true
    secrets: inherit
