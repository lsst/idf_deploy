# Deploys Science Platform Stable GCP Project with Terraform
name: 'RSP STABLE GCP Project'

on:
  pull_request:
    paths:
      - 'environment/deployments/science-platform/env/production.tfvars'
  push:
    paths:
      - 'environment/deployments/science-platform/env/production.tfvars'
    branches:
      - main
  # Re-enable this when/if we want to deal with drift
  # schedule:
  # - cron: 25 2 * * *

jobs:
  terraform:
    name: Terraform
    uses: ./.github/workflows/_reusable-terraform-plan-apply.yaml
    with:
      working_directory: ./environment/deployments/science-platform
      state_prefix: science-platform/stable
      tfvars_file: env/production.tfvars
    secrets: inherit
