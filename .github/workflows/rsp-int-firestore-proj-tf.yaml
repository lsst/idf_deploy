# Deploys Science Platform Firestore Integration GCP Project with Terraform
name: 'RSP INT FIRESTORE GCP Project'

on:
  pull_request:
    paths:
      - 'environment/deployments/science-platform/firestore/env/integration.tfvars'
  push:
    paths:
      - 'environment/deployments/science-platform/firestore/env/integration.tfvars'
    branches:
      - main
  # Re-enable this when/if we want to deal with drift
  # schedule:
  # - cron: 25 2 * * *

jobs:
  terraform:
    name: Terraform
    uses: ./.github/workflows/_reusable-terraform-plan-apply.yaml
    with:
      working_directory: ./environment/deployments/science-platform/firestore
      state_prefix: science-platform/firestore/int
      tfvars_file: env/integration.tfvars
    secrets: inherit
