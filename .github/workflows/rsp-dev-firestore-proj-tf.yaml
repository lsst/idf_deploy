# Deploys Science Platform Integration GCP Project with Terraform
name: 'RSP DEV FIRESTORE GCP Project'

on:
  pull_request:
    paths:
      - 'environment/deployments/science-platform/firestore/env/dev.tfvars'
  push:
    paths:
      - 'environment/deployments/science-platform/firestore/env/dev.tfvars'
    branches:
      - main
  # Re-enable this when/if we want to deal with drift
  # schedule:
  # - cron: 25 2 * * *

jobs:
  terraform:
    name: Terraform
    uses: ./.github/workflows/_reusable-terraform-plan-apply.yaml
    with:
      working_directory: ./environment/deployments/science-platform/firestore
      state_prefix: science-platform/firestore/dev
      tfvars_file: env/dev.tfvars
    secrets: inherit
