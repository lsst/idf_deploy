# Deploys SND Prod GCP Prod Services with Terraform
name: 'SND Prod GCP Services'

on:
  pull_request:
    paths:
      - 'environment/deployments/snd/env/prod-services.tfvars'
  push:
    paths:
      - 'environment/deployments/snd/env/prod-services.tfvars'
    branches:
      - main
  # Re-enable this when/if we want to deal with drift
  # schedule:
  # - cron: 25 2 * * *

jobs:
  terraform:
    name: Terraform
    uses: ./.github/workflows/_reusable-terraform-plan-apply.yaml
    with:
      working_directory: ./environment/deployments/snd/services
      state_prefix: snd/prod/services
      tfvars_file: ../env/prod-services.tfvars
    secrets: inherit
