# Deploys Service Accounts for Pipelines
name: 'GCP SA for Pipelines'

on:
  pull_request:
    paths:
      - 'environment/foundation/pipeline_serviceaccounts/terraform.tfvars'
  push:
    branches:
      - main
    paths:
      - 'environment/foundation/pipeline_serviceaccounts/terraform.tfvars'
  # Re-enable this when/if we want to deal with drift
  # schedule:
  # - cron: 25 2 * * *

jobs:
  terraform:
    name: Terraform
    uses: ./.github/workflows/_reusable-terraform-plan-apply.yaml
    with:
      working_directory: ./environment/foundation/pipeline_serviceaccounts/
      state_prefix: foundation/pipeline_serviceaccounts
      tfvars_file: terraform.tfvars
    secrets: inherit
