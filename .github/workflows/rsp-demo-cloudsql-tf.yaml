# Deploys Science Platform Demo GCP Project with Terraform
name: 'RSP DEMO CLOUD SQL'

on:
  # workflow dispatch # Comment out below, uncomment this to disable
  pull_request:
    paths:
      - 'environment/deployments/science-platform/env/demo-cloudsql.tfvars'
  push:
    branches:
      - main
    paths:
      - 'environment/deployments/science-platform/env/demo-cloudsql.tfvars'
  # Re-enable this when/if we want to deal with drift
  # schedule:
  # - cron: 25 2 * * *

jobs:
  terraform:
    name: Terraform
    uses: ./.github/workflows/_reusable-terraform-plan-apply.yaml
    with:
      working_directory: ./environment/deployments/science-platform/cloudsql
      state_prefix: science-platform/demo/cloudsql
      tfvars_file: ../env/demo-cloudsql.tfvars
    secrets: inherit
