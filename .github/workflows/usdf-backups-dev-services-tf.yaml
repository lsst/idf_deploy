# Deploys USDF Backups Dev GCP Dev Services with Terraform
name: 'USDF Backups Dev GCP Services'

on:
  pull_request:
    paths:
      - 'environment/deployments/usdf-backups/env/dev-services.tfvars'
  push:
    paths:
      - 'environment/deployments/usdf-backups/env/dev-services.tfvars'
    branches:
      - main
  # Re-enable this when/if we want to deal with drift
  # schedule:
  # - cron: 25 2 * * *

jobs:
  terraform:
    name: Terraform
    uses: ./.github/workflows/_reusable-terraform-plan-apply.yaml
    with:
      working_directory: ./environment/deployments/usdf-backups/services
      state_prefix: usdf-backups/dev/services
      tfvars_file: ../env/dev-services.tfvars
    secrets: inherit
