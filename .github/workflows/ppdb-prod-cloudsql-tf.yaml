# Deploys PPDB Prod Cloud SQL with Terraform
name: 'PPDB Prod Cloud SQL'

on:
  pull_request:
    paths:
      - 'environment/deployments/ppdb/env/prod-cloudsql.tfvars'
  push:
    paths:
      - 'environment/deployments/ppdb/env/prod-cloudsql.tfvars'
    branches:
      - main
      # Re-enable this when/if we want to deal with drift
      # schedule:
      # - cron: 25 2 * * *

jobs:
  terraform:
    name: Terraform
    uses: ./.github/workflows/_reusable-terraform-plan-apply.yaml
    with:
      working_directory: ./environment/deployments/ppdb/cloudsql
      state_prefix: ppdb/prod/cloudsql
      tfvars_file: ../env/prod-cloudsql.tfvars
    secrets: inherit
