# Deploys GCP Organization level settings with Terraform
name: 'GCP Organization Level Settings'

on:
  pull_request:
    paths:
      - 'environment/foundation/1-org/1-org.tfvars'
  push:
    paths:
      - 'environment/foundation/1-org/1-org.tfvars'
    branches:
      - main
  # Re-enable this when/if we want to deal with drift
  # schedule:
  # - cron: 25 2 * * *

jobs:
  terraform:
    name: Terraform
    uses: ./.github/workflows/_reusable-terraform-plan-apply.yaml
    with:
      working_directory: ./environment/foundation/1-org/
      state_prefix: foundation/1-org
      tfvars_file: 1-org.tfvars
    secrets: inherit
