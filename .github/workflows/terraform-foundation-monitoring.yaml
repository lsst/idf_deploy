# Deploys GCP Monitoring Dashboards
name: 'GCP Monitoring Dashboards'

on:
  pull_request:
    paths:
      - 'environment/foundation/monitoring/monitoring.tfvars'
  push:
    branches:
      - main
    paths:
      - 'environment/foundation/monitoring/monitoring.tfvars'
  # Re-enable this when/if we want to deal with drift
  # schedule:
  # - cron: 25 2 * * *

jobs:
  terraform:
    name: Terraform
    uses: ./.github/workflows/_reusable-terraform-plan-apply.yaml
    with:
      working_directory: ./environment/foundation/monitoring/
      state_prefix: foundation/monitoring
      tfvars_file: monitoring.tfvars
    secrets: inherit
