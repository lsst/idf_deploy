# Deploys PPDB Int Cloud SQL with Terraform
name: 'PPDB Int Cloud SQL'

on:
  pull_request:
    paths:
      - 'environment/deployments/ppdb/env/int-cloudsql.tfvars'
  push:
    paths:
      - 'environment/deployments/ppdb/env/int-cloudsql.tfvars'
    branches:
      - main
  # Re-enable this when/if we want to deal with drift
  schedule:
    - cron: 25 2 * * *

jobs:
  terraform:
    name: Terraform
    uses: ./.github/workflows/_reusable-terraform-plan-apply.yaml
    with:
      working_directory: ./environment/deployments/ppdb/cloudsql
      state_prefix: ppdb/int/cloudsql
      tfvars_file: ../env/int-cloudsql.tfvars
      export_state_bucket: true
      checkout_version: v4
      google_actions_version: v3
      setup_terraform_version: v3
    secrets:
      gcp_credentials: ${{ secrets.GOOGLE_CREDENTIALS }}
      gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
      terraform_state_bucket: ${{ secrets.TERRAFORM_STATE_BUCKET }}
      slack_webhook: ${{ secrets.SLACK_ALERT_WEBHOOK }}
